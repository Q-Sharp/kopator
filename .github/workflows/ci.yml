name: CI

on:
  push:
    branches: [master]
    tags: ['v*']
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true

jobs:
  build:
    name: Build & Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]

    steps:
      - uses: actions/checkout@v7
        with:
          # MinVer derives the version from tags, so the full history is required.
          fetch-depth: 0

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore kopator.slnx

      - name: Build
        run: dotnet build kopator.slnx --configuration Release --no-restore

      - name: Test
        run: dotnet test --configuration Release --no-build

  publish:
    name: Publish ${{ matrix.rid }}
    # Release binaries are only built for tags; both runtimes cross-publish from Linux.
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - rid: linux-x64
            asset: kopator-linux-x64
          - rid: win-x64
            asset: kopator-win-x64.exe

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Publish self-contained single file
        run: >
          dotnet publish src/Kopator.App/Kopator.App.csproj
          --configuration Release
          --runtime ${{ matrix.rid }}
          --self-contained true
          --output publish/${{ matrix.rid }}

      - name: Rename binary to its asset name
        run: |
          set -euo pipefail
          binary="publish/${{ matrix.rid }}/kopator"
          if [ -f "$binary.exe" ]; then
            binary="$binary.exe"
          fi
          mv "$binary" "publish/${{ matrix.asset }}"

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.asset }}
          path: publish/${{ matrix.asset }}
          if-no-files-found: error

  release:
    name: Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/download-artifact@v8
        with:
          path: artifacts
          merge-multiple: true

      - name: Publish release assets
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail

          # The tag may already carry a release: creating one through the GitHub UI
          # pushes the tag, which is what triggered this run in the first place. In
          # that case attach the binaries to what is there instead of failing, and
          # leave its title, notes and pre-release flag as the author set them.
          if gh release view "$TAG" --repo "$REPO" >/dev/null 2>&1; then
            echo "Release $TAG already exists - uploading assets to it."
            gh release upload "$TAG" --repo "$REPO" --clobber artifacts/*
            exit 0
          fi

          # A tag such as v1.4.0-rc.1 carries a SemVer pre-release part and is
          # published as a GitHub pre-release.
          create_args=()
          case "$TAG" in
            *-*) create_args+=(--prerelease) ;;
          esac

          echo "Creating release $TAG."
          gh release create "$TAG" \
            --repo "$REPO" \
            --title "$TAG" \
            --generate-notes \
            "${create_args[@]}" \
            artifacts/*
